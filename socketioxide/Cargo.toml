[package]
name = "socketioxide-bench-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to the current stable release as of 2026-06. The crate is on a
# steady ~monthly cadence; bump in tandem with engineioxide when a new
# semver-minor lands. v4 enables the Socket.io v4 wire protocol that
# our bench-runner's socket.io-client driver speaks.
socketioxide = { version = "0.18", features = ["v4", "tracing"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
