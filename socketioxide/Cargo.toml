[package]
name = "socketioxide-bench-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pin to a recent socketioxide; the API for CSR / connection state
# recovery has shifted across versions, so the library author is the
# right person to bump this if needed.
socketioxide = { version = "0.16", features = ["state-recovery"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
